AWSTemplateFormatVersion: '2010-09-09'
Description: Airline No-Show application on ECS Fargate with private RDS PostgreSQL.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Existing VPC for the load balancer, tasks, and database.
  PublicSubnetA:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet in the selected VPC, in one Availability Zone.
  PublicSubnetB:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet in another Availability Zone.
  PrivateApplicationSubnetA:
    Type: AWS::EC2::Subnet::Id
    Description: Private application subnet with NAT or required VPC endpoints.
  PrivateApplicationSubnetB:
    Type: AWS::EC2::Subnet::Id
    Description: Private application subnet in another Availability Zone.
  PrivateSubnetA:
    Type: AWS::EC2::Subnet::Id
    Description: Private database subnet in one Availability Zone.
  PrivateSubnetB:
    Type: AWS::EC2::Subnet::Id
    Description: Private database subnet in another Availability Zone.
  BackendImage:
    Type: String
    Description: ECR image URI for docker/Dockerfile.backend.
  FrontendImage:
    Type: String
    Description: ECR image URI for docker/Dockerfile.frontend.
  DBName:
    Type: String
    Default: airline_noshow
    AllowedPattern: '^[a-zA-Z][a-zA-Z0-9_]{0,62}$'
  DBUsername:
    Type: String
    Default: airline_admin
    AllowedPattern: '^[a-zA-Z][a-zA-Z0-9_]{0,62}$'
    NoEcho: true
    Description: RDS administrator account; it is not used by application tasks.
  DBInstanceClass:
    Type: String
    Default: db.t4g.micro
  CertificateArn:
    Type: String
    AllowedPattern: '^arn:[^:]+:acm:[a-z0-9-]+:[0-9]{12}:certificate/[0-9a-fA-F-]+$'
    ConstraintDescription: Supply a valid ACM certificate ARN in the same AWS Region.
    Description: Required ACM certificate ARN for the HTTPS listener.
  RateLimitStorageSecretArn:
    Type: String
    AllowedPattern: '^arn:[^:]+:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+$'
    Description: Secrets Manager secret containing the shared Redis rediss:// storage URI.

Resources:
  FlaskSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}/flask-secret'
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true

  JwtSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}/jwt-secret'
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true

  RuntimeDatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}/runtime-database'
      GenerateSecretString:
        SecretStringTemplate: '{"username":"airline_runtime"}'
        GenerateStringKey: password
        PasswordLength: 48
        ExcludePunctuation: true

  MigrationDatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}/migration-database'
      GenerateSecretString:
        SecretStringTemplate: '{"username":"airline_migrator"}'
        GenerateStringKey: password
        PasswordLength: 48
        ExcludePunctuation: true

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTP redirect and HTTPS ingress to the application.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0

  ApplicationSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Permit application traffic only from the load balancer.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !GetAtt LoadBalancerSecurityGroup.GroupId

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Permit PostgreSQL only from application tasks.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !GetAtt ApplicationSecurityGroup.GroupId

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private-address database subnets for the application.
      SubnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: 20
      StorageType: gp3
      StorageEncrypted: true
      DBName: !Ref DBName
      MasterUsername: !Ref DBUsername
      ManageMasterUserPassword: true
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 7
      AutoMinorVersionUpgrade: true
      VPCSecurityGroups:
        - !GetAtt DatabaseSecurityGroup.GroupId
      DBSubnetGroupName: !Ref DatabaseSubnetGroup

  ApplicationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${AWS::StackName}'
      RetentionInDays: 30

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadApplicationSecrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref FlaskSecret
                  - !Ref JwtSecret
                  - !Ref RuntimeDatabaseSecret
                  - !Ref MigrationDatabaseSecret
                  - !Ref RateLimitStorageSecretArn

  ApplicationCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${AWS::StackName}-cluster'

  ApplicationTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${AWS::StackName}-task'
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      Cpu: '1024'
      Memory: '2048'
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      ContainerDefinitions:
        - Name: backend
          Image: !Ref BackendImage
          Essential: true
          MemoryReservation: 1536
          PortMappings:
            - ContainerPort: 5000
              Protocol: tcp
          Environment:
            - Name: FLASK_ENV
              Value: production
            - Name: ALLOW_PUBLIC_REGISTRATION
              Value: 'false'
            - Name: HOST
              Value: 0.0.0.0
            - Name: PORT
              Value: '5000'
            - Name: DB_TYPE
              Value: postgresql
            - Name: DB_HOST
              Value: !GetAtt Database.Endpoint.Address
            - Name: DB_PORT
              Value: !GetAtt Database.Endpoint.Port
            - Name: DB_NAME
              Value: !Ref DBName
            - Name: DB_USER
              Value: airline_runtime
            - Name: AUTO_CREATE_SCHEMA
              Value: 'false'
            - Name: MODEL_DIR
              Value: /app/models
            - Name: CORS_ORIGINS
              Value: !Sub 'https://${ApplicationLoadBalancer.DNSName}'
            - Name: TRUSTED_PROXY_HOPS
              Value: '2'
          Secrets:
            - Name: DB_PASSWORD
              ValueFrom: !Sub '${RuntimeDatabaseSecret}:password::'
            - Name: SECRET_KEY
              ValueFrom: !Ref FlaskSecret
            - Name: JWT_SECRET_KEY
              ValueFrom: !Ref JwtSecret
            - Name: RATELIMIT_STORAGE_URI
              ValueFrom: !Ref RateLimitStorageSecretArn
          HealthCheck:
            Command:
              - CMD-SHELL
              - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=5)"
            Interval: 30
            Timeout: 10
            Retries: 6
            StartPeriod: 180
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ApplicationLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: backend
        - Name: frontend
          Image: !Ref FrontendImage
          Essential: true
          MemoryReservation: 256
          PortMappings:
            - ContainerPort: 80
              Protocol: tcp
          Environment:
            - Name: API_PROXY_HOST
              Value: 127.0.0.1
            - Name: NGINX_ENVSUBST_FILTER
              Value: $API_PROXY_HOST
          DependsOn:
            - ContainerName: backend
              Condition: HEALTHY
          HealthCheck:
            Command:
              - CMD-SHELL
              - wget --quiet --tries=1 --spider http://127.0.0.1/
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 10
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ApplicationLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: frontend

  ApplicationMigrationTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${AWS::StackName}-migration'
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      Cpu: '512'
      Memory: '1024'
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      ContainerDefinitions:
        - Name: database-migration
          Image: !Ref BackendImage
          Essential: true
          Command:
            - python
            - backend/migrate.py
          Environment:
            - Name: DB_TYPE
              Value: postgresql
            - Name: DB_HOST
              Value: !GetAtt Database.Endpoint.Address
            - Name: DB_PORT
              Value: !GetAtt Database.Endpoint.Port
            - Name: DB_NAME
              Value: !Ref DBName
            - Name: DB_USER
              Value: airline_migrator
            - Name: DB_RUNTIME_USER
              Value: airline_runtime
          Secrets:
            - Name: DB_PASSWORD
              ValueFrom: !Sub '${MigrationDatabaseSecret}:password::'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ApplicationLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: migration

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      Subnets:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB
      SecurityGroups:
        - !GetAtt LoadBalancerSecurityGroup.GroupId

  ApplicationTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Port: 80
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref VpcId
      HealthCheckPath: /api/health
      HealthCheckProtocol: HTTP
      Matcher:
        HttpCode: '200'

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: '443'
            StatusCode: HTTP_301

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ApplicationTargetGroup

  ApplicationService:
    Type: AWS::ECS::Service
    DependsOn:
      - Database
      - HttpListener
    Properties:
      ServiceName: !Sub '${AWS::StackName}-service'
      Cluster: !Ref ApplicationCluster
      TaskDefinition: !Ref ApplicationTask
      DesiredCount: 1
      LaunchType: FARGATE
      HealthCheckGracePeriodSeconds: 240
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !Ref PrivateApplicationSubnetA
            - !Ref PrivateApplicationSubnetB
          SecurityGroups:
            - !GetAtt ApplicationSecurityGroup.GroupId
      LoadBalancers:
        - ContainerName: frontend
          ContainerPort: 80
          TargetGroupArn: !Ref ApplicationTargetGroup

Outputs:
  ApplicationUrl:
    Description: HTTPS-only application entry point.
    Value: !Sub 'https://${ApplicationLoadBalancer.DNSName}'
  DatabaseEndpoint:
    Description: Private RDS endpoint; it is not publicly accessible.
    Value: !GetAtt Database.Endpoint.Address
  MigrationTaskDefinition:
    Description: Run this one-off task after bootstrapping the migration and runtime PostgreSQL roles.
    Value: !Ref ApplicationMigrationTask
